spring.application.name=Sistemas-chamados-ifrn

# Banco por variáveis de ambiente (sem senha fixa)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chamados_ifrn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway cria o esquema; Hibernate só valida
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# Paginação: padrão 10, máximo 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50